[project]
name = "weibiye-backend"
version = "0.1.0"
description = "WeiBiYe modular monolith foundation"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.36,<1",
  "sqlalchemy[asyncio]>=2.0.38,<2.1",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.8,<3",
  "alembic>=1.15,<2",
  "redis>=5.2,<8",
  "langgraph>=1.0,<2",
  "openai>=2,<3",
  "argon2-cffi>=25.1,<26",
  "email-validator>=2.3,<3",
]

[project.optional-dependencies]
qq = ["cryptography>=50.0.2,<51", "httpx>=0.28,<1", "websockets>=17.4,<18"]

[dependency-groups]
dev = ["pytest>=8.3,<10", "pytest-asyncio>=0.25,<2", "httpx>=0.28,<1", "ruff>=0.11,<1", "aiosqlite>=0.21,<1", "pyyaml>=6,<7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"app/db/models.py" = ["F401"]
