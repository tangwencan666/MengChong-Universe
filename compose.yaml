name: weibiye
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: weibiye
      POSTGRES_PASSWORD: ${WEIBIYE_DB_PASSWORD:?Provide a local WeiBiYe DB password}
      POSTGRES_DB: weibiye
    ports: ["127.0.0.1:25433:5432"]
    volumes: ["weibiye_pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U weibiye -d weibiye"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["127.0.0.1:26380:6379"]
    volumes: ["weibiye_redisdata:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  migrate:
    build: ./backend
    command: [".venv/bin/alembic", "upgrade", "head"]
    environment: &backend-environment
      WEIBIYE_DATABASE_URL: postgresql+psycopg://weibiye:${WEIBIYE_DB_PASSWORD}@postgres:5432/weibiye
      WEIBIYE_REDIS_URL: redis://redis:6379/0
      WEIBIYE_ENVIRONMENT: development
      WEIBIYE_LLM_PROVIDER: mock
      WEIBIYE_REAL_LLM_ENABLED: "false"
      WEIBIYE_DEMO_ENABLED: "true"
      WEIBIYE_RATE_LIMIT_BACKEND: redis
      WEIBIYE_CORS_ORIGINS: '["http://127.0.0.1:38081"]'
    depends_on:
      postgres: { condition: service_healthy }
  backend:
    build: ./backend
    environment: *backend-environment
    ports: ["127.0.0.1:38101:8000"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", ".venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 10
  frontend:
    build: ./frontend
    ports: ["127.0.0.1:38081:8080"]
    depends_on:
      backend: { condition: service_healthy }
volumes:
  weibiye_pgdata:
  weibiye_redisdata:
